name: tasking-manager-main

networks:
  tm-net:
    name: tm-net

services:
  tm-db:
    image: "mdillon/postgis:11"
    volumes:
      - /srv/postgresql:/var/lib/postgresql/data
    env_file: tasking-manager.env
    restart: unless-stopped
    healthcheck:
      test: pg_isready -U ${POSTGRES_USER}
      start_period: 35s
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - tm-net

  tm-backend:
    image: ghcr.io/osmitalia/osmit-tm-backend:v5.0.6
    depends_on:
      tm-db:
        condition: service_healthy
      tm-migration:
        condition: service_completed_successfully
    env_file:
      - tasking-manager.env
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:5000/api/docs
      interval: 10s
      retries: 5
      start_period: 10s
      timeout: 3s
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "1"
          memory: 1500M
        reservations:
          cpus: "1"
          memory: 100M
    labels:
      - traefik.http.routers.backend.rule=Host(`osmit-tm4.wmcloud.org`) && PathPrefix(`/api/`)
      - traefik.http.services.backend.loadbalancer.server.port=5000
    networks:
      - tm-net

  tm-migration:
    image: ghcr.io/osmitalia/osmit-tm-backend:v5.0.6
    entrypoint: ["alembic", "-c", "migrations/alembic.ini", "upgrade", "head"]
    depends_on:
      tm-db:
        condition: service_healthy
    env_file:
      - tasking-manager.env
    deploy:
      replicas: ${API_REPLICAS:-1}
      resources:
        limits:
          cpus: "1"
          memory: 1500M
        reservations:
          cpus: "1"
          memory: 100M
    networks:
      - tm-net

  tm-cron-jobs:
    image: ghcr.io/osmitalia/osmit-tm-backend:v5.0.6
    command: ["python", "backend/cron_jobs.py"]
    depends_on:
      tm-db:
        condition: service_healthy
    env_file:
      - tasking-manager.env
    environment:
      - PYTHONPATH=/usr/src/app
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.2"
          memory: 128M
    networks:
      - tm-net

  tm-frontend:
    image: ghcr.io/osmitalia/osmit-tm-frontend:v5.0.6
    env_file:
      - tasking-manager.env
    labels:
      - traefik.http.routers.frontend.rule=Host(`osmit-tm4.wmcloud.org`)
      - traefik.http.services.frontend.loadbalancer.server.port=3000
    networks:
      - tm-net

  traefik:
    image: traefik:v2.10
    restart: always
    ports:
      - "${TM_DEV_PORT:-3000}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --entrypoints.web.address=:80
      - --providers.docker=true
    networks:
      - tm-net
